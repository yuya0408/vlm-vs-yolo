# モデル定義(runner --model のエントリ名で参照)
# プロンプトは conf/prompts/{prompt}.txt。変更は必ず PR 経由(プロンプト = コード)
# v4: 比較対象は「汎用 VLM(Gemini Flash)」と「専用検出器(YOLO)」の 2 本に集約。
mock:
  provider: mock

flash:
  provider: gemini
  model: gemini-3.5-flash      # 2026最新の安定版Flash(GA, 2026-05)。実行時に ai.google.dev/models で正確なIDを最終確認
  prompt: concise
  temperature: 0
  # 低コストで回すなら model を gemini-2.5-flash($0.30/$2.50)等に差し替え可(pricing.yaml も合わせる)

# --- プロンプト感度検証用(src/analysis/prompt_sensitivity.py)---
# VLM 側の「探索空間」= プロンプト。YOLO の閾値スイープと非対称なので全走査はできないが、
# 水準を 3 本振って結論が反転しないかだけは確認する(model/temperature は flash と同一、
# 変えるのは prompt のみ)。run_id にプロンプト名が入るので結果は互いに上書きしない。
flash_deliberate:
  provider: gemini
  model: gemini-3.5-flash
  prompt: deliberate           # 項目ごとに evidence を先に書かせてから判定(reason-then-answer)
  temperature: 0

flash_calibrated:
  provider: gemini
  model: gemini-3.5-flash
  prompt: calibrated           # チェックリスト由来の過剰主張を抑え、uncertain の使用基準を明示
  temperature: 0

yolo:
  provider: yolo
  weights: yolo26x.pt          # ultralytics 学習済み(COCO 80 クラス, 2026最新)。ローカル推論・無料・決定論的
  conf_threshold: 0.25         # この信頼度以上で 1 個でも検出 → present に還元(bbox 座標は比較に使わない)
  # YOLO は uncertain を返さない(2 値: present/absent)。
  # 「VLM だけが不確実性を表現できる」点自体を比較の観察対象とする(REPORT に記載)。
