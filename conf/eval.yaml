# 評価セット構築の設定(build_eval_set.py が読む)
seed: 42
n_images: 300        # フル評価セット(v4: VLM API ラン 1 本で完結する規模に縮小)
smoke_n: 50          # PR 用 smoke セット(フルの部分集合)

checklist:
  min_items: 5
  max_items: 10

# 層化サンプリングの層定義
strata:
  n_objects: [1, 3, 8]            # 境界値: ~1 / 2-3 / 4-8 / 9~
  min_bbox_area_ratio: [0.005, 0.05]  # 小物体を含む層を確保

# negative に優先的に混入する「混同しやすいペア」
confusable_pairs:
  - [dog, cat]
  - [car, truck]
  - [couch, chair]
  - [cup, wine glass]
  - [sheep, cow]
  - [backpack, handbag]

paths:
  coco_images: data/coco/val2017
  coco_annotations: data/coco/annotations/instances_val2017.json
